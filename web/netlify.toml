[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[context.production.environment]
  NUXT_PUBLIC_IS_PROD = "true"

[context.develop.environment]
  NUXT_PUBLIC_IS_PROD = "false"

# Cache immutable : renommer le fichier si une police change
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Lu par le Dashboard du Studio (autre origine) : ne pas retirer
[[headers]]
  for = "/_nuxt/builds/latest.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
